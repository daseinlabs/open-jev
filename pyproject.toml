[project]
name = "openjev"
version = "0.1.0"
description = "Local option scoring and trainable candidate-decision heads"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "mlx>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.6; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
torch = ["torch>=2.6", "accelerate>=1.0"]   # PyTorch backend on Apple silicon, comparisons and HF cross-checks
finetune = ["chess>=1.10", "pyarrow>=15"]   # finetune/ chess next-move LoRA data prep
doom = ["vizdoom>=1.2.4"]                         # demo/doom: play Doom in the terminal with the server choosing actions
video = ["av>=14", "pillow>=11"]                   # openjev.video frame sampling and video_eval/ (image input runs on the torch backend)
video-train = ["mlx-vlm[train]==0.7.8; sys_platform == 'darwin' and platform_machine == 'arm64'"]  # video LoRA training on MLX (pinned: weekly releases)
parity = ["torchvision"]                            # official Gemma 4 processor for tests/test_gemma4_processor_parity.py only


[project.scripts]
openjev = "openjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjev"]

[dependency-groups]
test = ["httpx>=0.27"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
