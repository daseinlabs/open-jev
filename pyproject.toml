[project]
name = "openjev-sdk"
version = "0.2.0"
description = "Train small task-oriented decision models on your own traces: pick, calibrate, defer, and improve with RL"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Dasein Labs" }]
keywords = ["decision model", "agents", "tool calling", "fine-tuning", "reinforcement learning", "mlx", "pytorch", "cuda", "gemma"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Environment :: GPU :: NVIDIA CUDA",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.141.1",
    "huggingface-hub>=1.31.0",
    "mlx>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "mlx-lm>=0.24; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.6; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "numpy>=2.5.3",
    "safetensors>=0.8.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
]

[project.optional-dependencies]
torch = ["torch>=2.6", "accelerate>=1.0"]   # PyTorch backend on Apple silicon, comparisons and HF cross-checks
finetune = ["chess>=1.10", "pyarrow>=15"]   # finetune/ chess next-move LoRA data prep
doom = ["vizdoom>=1.2.4"]                         # demo/doom: play Doom in the terminal with the server choosing actions


[project.urls]
Homepage = "https://github.com/daseinlabs/open-jev"
Documentation = "https://github.com/daseinlabs/open-jev/blob/main/docs/tod-sdk.md"
Cookbooks = "https://github.com/daseinlabs/open-jev/tree/main/cookbooks"

[project.scripts]
openjev = "openjev.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openjev"]

[tool.hatch.build.targets.sdist]
include = ["/openjev/", "/tests/", "/README.md", "/LICENSE", "/pyproject.toml"]

[dependency-groups]
test = ["httpx>=0.27"]
docs = ["mkdocs>=1.6", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.26"]
